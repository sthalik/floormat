name: commit

on:
  push:
    branches: [ master, wip ]
  pull_request:
    branches: [ master, wip ]

env:
  BUILD_TYPE: Debug
  LLDB_VERSION: 23.1.3

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025-vs2026, windows-11-vs2026-arm, macos-26]
        include:
        - os: ubuntu-26.04
          cmake: /usr/bin/env CC=gcc-16 CXX=g++-16 cmake
        - os: macos-26
          cmake: /usr/bin/env CC="$(brew --prefix llvm)/bin/clang" CXX="$(brew --prefix llvm)/bin/clang++" cmake
        - os: windows-2025-vs2026
          cmake: .\.github\workflows\build-windows.bat cmake
          toolchain: cmake/msvc.cmake
        - os: windows-11-vs2026-arm
          cmake: .\.github\workflows\build-windows.bat cmake
          toolchain: cmake/msvc.cmake

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - uses: abdes/gha-setup-ninja@master
      with:
        version: 1.11.1
      if: runner.os != 'Linux'

    - name: Install Linux dependencies
      run: |
        sudo apt -q=2 update
        sudo apt -q install g++-16 gdb ninja-build
        sudo apt -q install libgl1-mesa-dri libgl-dev libglx-dev xorg-dev xvfb libopencv-dev
        sudo apt -q install libsdl2-dev
      if: runner.os == 'Linux'

    - name: Install OSX dependencies
      run: |
        brew install SDL2 google-benchmark llvm
      if: runner.os == 'macOS'

    - name: Configure
      run: ${{matrix.cmake}} -G "Ninja" -S ${{github.workspace}}/ -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} ${{ matrix.toolchain && format('--toolchain {0}/{1}', github.workspace, matrix.toolchain) || '' }}

    - name: Build
      run: ${{matrix.cmake}} --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target install

    - name: Test
      run: |
        cd ${{github.workspace}}/build/install
        export MAGNUM_LOG=default
        export LD_LIBRARY_PATH="$PWD/lib" ASAN_OPTIONS="detect_leaks=0:abort_on_error=1"
        # llvmpipe hands back 4.5 core, which hides every use of GL above the 3.3
        # floor. Pin it so the runner is the conformance oracle it looks like.
        export MESA_GL_VERSION_OVERRIDE=3.3FC MESA_GLSL_VERSION_OVERRIDE=330
        export MESA_EXTENSION_OVERRIDE=-GL_ARB_explicit_uniform_location
        set -e
        xvfb-run gdb -q -batch -x ../../.github/gdbscript.py --args bin/floormat-test
        xvfb-run gdb -q -batch -x ../../.github/gdbscript.py --args bin/floormat-benchmark
      timeout-minutes: 60
      if: runner.os == 'Linux'

    - name: Test without a GL context
      run: |
        cd ${{github.workspace}}/build/install
        export MAGNUM_LOG=default
        export LD_LIBRARY_PATH="$PWD/lib" ASAN_OPTIONS="detect_leaks=0:abort_on_error=1"
        env -u DISPLAY -u WAYLAND_DISPLAY gdb -q -batch -x ../../.github/gdbscript.py --args bin/floormat-test --no-gl
      timeout-minutes: 60
      if: ${{ !cancelled() && runner.os == 'Linux' }}

    - name: Test without a GL context
      run: |
        cd build/install
        export MAGNUM_LOG=default
        lldb --batch -o "command script import ../../.github/lldbscript.py" -- bin/floormat-test --no-gl
      shell: bash
      timeout-minutes: 60
      if: ${{ !cancelled() && runner.os == 'macOS' }}

    # liblldb.dll imports python3.dll.
    - uses: actions/setup-python@v5
      with:
        python-version: 3.x
      if: ${{ !cancelled() && runner.os == 'Windows' }}

    - name: Cache lldb
      id: lldb-cache
      uses: actions/cache@v4
      with:
        path: build/lldb
        key: lldb-v3-${{ env.LLDB_VERSION }}-${{ runner.arch }}
      if: ${{ !cancelled() && runner.os == 'Windows' }}

    # The release tarballs have no lldb, only the MSIs do. lldb looks for its Python package
    # in ../lib/site-packages from liblldb.dll. native/_lldb.pyd is a 112 MB copy of
    # liblldb.dll, unused because lldb imports its built-in _lldb first.
    - name: Download lldb
      run: |
        case "$RUNNER_ARCH" in ARM64) arch=woa64 ;; *) arch=win64 ;; esac
        curl -fsSL --retry 3 -o build/llvm.msi "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLDB_VERSION/LLVM-$LLDB_VERSION-$arch.msi"
        7z e -y -obuild/lldb build/llvm.msi CM_FP_bin.liblldb.dll CM_FP_bin.lldb.exe 'CM_FP_lib.site_packages.lldb.*.py'
        rm build/llvm.msi
        cd build/lldb
        # The MSI's names are the install paths with dots for slashes.
        for f in CM_FP_*; do
            p=$(echo "${f#CM_FP_}" | sed 's/\.\([a-z]*\)$/@\1/; s/\./\//g; s/@/./; s/site_packages/site-packages/')
            mkdir -p "$(dirname "$p")"
            mv "$f" "$p"
        done
      shell: bash
      if: ${{ !cancelled() && runner.os == 'Windows' && steps.lldb-cache.outputs.cache-hit != 'true' }}

    - name: Test without a GL context
      run: |
        cd build/install
        export MAGNUM_LOG=default
        # lldb-server never resumes the process after it loads a plugin DLL.
        export LLDB_USE_LLDB_SERVER=0
        # A process started by a debugger otherwise gets the slow NT debug heap.
        export _NO_DEBUG_HEAP=1
        ../lldb/bin/lldb.exe --batch -o "command script import ../../.github/lldbscript.py" -- bin/floormat-test.exe --no-gl 2>&1 </dev/null | tr -d '\r'
      shell: bash
      timeout-minutes: 60
      if: ${{ !cancelled() && runner.os == 'Windows' }}

    # floormat-test --no-gl runs these tests in the default build. These are the builds it never gets: sanitizers on macOS, and the mutex/condvar fallback of atomic_wait.
    - name: Test atomics and the work-stealing deque
      run: |
        sh .github/thread-tests.sh c++ -O1 -fsanitize=address,undefined -fno-sanitize-recover=all
        sh .github/thread-tests.sh c++ -O1 -fsanitize=thread
        sh .github/thread-tests.sh c++ -O2 -DFM_NO_PLATFORM_ATOMIC_WAIT
        sh .github/thread-tests.sh c++ -O2 -mmacosx-version-min=14.0
      timeout-minutes: 60
      if: ${{ !cancelled() && runner.os == 'macOS' }}

    - name: Test the mutex/condvar fallback of atomic_wait
      run: |
        sh .github/thread-tests.sh g++-16 -O2 -DFM_NO_PLATFORM_ATOMIC_WAIT
        sh .github/thread-tests.sh g++-16 -O1 -fsanitize=thread -DFM_NO_PLATFORM_ATOMIC_WAIT
      timeout-minutes: 60
      if: ${{ !cancelled() && runner.os == 'Linux' }}

    - name: Test the mutex/condvar fallback of atomic_wait with MSVC
      run: |
        .\.github\workflows\build-windows.bat call .github\thread-tests.bat -O2 -DFM_NO_PLATFORM_ATOMIC_WAIT && build\thread-tests\thread-tests.exe
      timeout-minutes: 60
      if: ${{ !cancelled() && runner.os == 'Windows' && runner.arch == 'ARM64' }}

    - name: Test pgo-driver scenes
      run: |
        cd ${{github.workspace}}/build/install
        export MAGNUM_LOG=default
        export LD_LIBRARY_PATH="$PWD/lib" ASAN_OPTIONS="detect_leaks=0:abort_on_error=1"
        export MESA_GL_VERSION_OVERRIDE=3.3FC MESA_GLSL_VERSION_OVERRIDE=330
        export MESA_EXTENSION_OVERRIDE=-GL_ARB_explicit_uniform_location
        export LP_NUM_THREADS=$(nproc) FLOORMAT_PGO_DRIVER_SHORTEN_SCENES=1
        set -e
        xvfb-run gdb -q -batch -x ../../.github/gdbscript.py --args \
            bin/floormat-editor --scenes=all --driver-no-swapbuffers
      timeout-minutes: 60
      if: runner.os == 'Linux'

    # No gdb: LeakSanitizer stops the threads with ptrace, which fails while gdb traces them.
    - name: Test for leaks
      run: |
        cd ${{github.workspace}}/build/install
        export MAGNUM_LOG=default
        export LD_LIBRARY_PATH="$PWD/lib" ASAN_OPTIONS="detect_leaks=1"
        # Otherwise SDL leaks what libdbus allocated.
        export SDL_SHUTDOWN_DBUS_ON_QUIT=1
        export MESA_GL_VERSION_OVERRIDE=3.3FC MESA_GLSL_VERSION_OVERRIDE=330
        export MESA_EXTENSION_OVERRIDE=-GL_ARB_explicit_uniform_location
        set -e
        xvfb-run bin/floormat-test
        env -u DISPLAY -u WAYLAND_DISPLAY bin/floormat-test --no-gl
        xvfb-run bin/floormat-editor --scenes=drag-paint --driver-no-swapbuffers
      timeout-minutes: 60
      if: ${{ !cancelled() && runner.os == 'Linux' }}

#    - name: Upload build
#      uses: actions/upload-artifact@v2.2.4
#      with:
#        name: buildoutput
#        path: ${{github.workspace}}/build/

  # Memcheck reports reads of uninitialized memory, which ASan doesn't see.
  valgrind:
    runs-on: ubuntu-26.04
    env:
      # --fair-sched: the thread tests have wall-clock deadlines, and the default lock tends to go
      # back to the thread that released it. --keep-debuginfo: the image importer plugins are
      # unloaded before the leak search.
      VALGRIND_OPTS: >-
        --error-exitcode=99 --track-origins=yes --leak-check=full --show-leak-kinds=all
        --errors-for-leak-kinds=definite,possible --track-fds=yes --fair-sched=yes
        --num-callers=40 --keep-debuginfo=yes --gen-suppressions=all
      # Otherwise SDL leaks what libdbus allocated.
      SDL_SHUTDOWN_DBUS_ON_QUIT: 1

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt -q=2 update
        sudo apt -q install g++-16 ninja-build valgrind
        sudo apt -q install libgl1-mesa-dri libgl-dev libglx-dev xorg-dev xvfb
        sudo apt -q install libsdl2-dev

    - name: Configure
      run: /usr/bin/env CC=gcc-16 CXX=g++-16 cmake -G "Ninja" -S ${{github.workspace}}/ -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DFLOORMAT_VALGRIND=1

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target install

    - name: Test under memcheck
      run: |
        cd ${{github.workspace}}/build/install
        export MAGNUM_LOG=default LD_LIBRARY_PATH="$PWD/lib"
        export MESA_GL_VERSION_OVERRIDE=3.3FC MESA_GLSL_VERSION_OVERRIDE=330
        export MESA_EXTENSION_OVERRIDE=-GL_ARB_explicit_uniform_location
        valgrind --version
        xvfb-run valgrind bin/floormat-test
      timeout-minutes: 60

    - name: Test without a GL context under memcheck
      run: |
        cd ${{github.workspace}}/build/install
        export MAGNUM_LOG=default LD_LIBRARY_PATH="$PWD/lib"
        env -u DISPLAY -u WAYLAND_DISPLAY valgrind bin/floormat-test --no-gl
      timeout-minutes: 60
      if: ${{ !cancelled() }}

    - name: Test pgo-driver scenes under memcheck
      run: |
        cd ${{github.workspace}}/build/install
        export MAGNUM_LOG=default LD_LIBRARY_PATH="$PWD/lib"
        export MESA_GL_VERSION_OVERRIDE=3.3FC MESA_GLSL_VERSION_OVERRIDE=330
        export MESA_EXTENSION_OVERRIDE=-GL_ARB_explicit_uniform_location
        export LP_NUM_THREADS=$(nproc) FLOORMAT_PGO_DRIVER_SHORTEN_SCENES=1
        # Fewer pixels for llvmpipe, and fewer frames for every wait timed in update().
        # With origin tracking, maze2 alone peaks at 45 GB, past the runner's 16.
        xvfb-run valgrind --track-origins=no bin/floormat-editor --scenes=all \
          --driver-no-swapbuffers --geometry 512x360 --fixed-framerate=15
      timeout-minutes: 60
      if: ${{ !cancelled() }}

  freebsd:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Start FreeBSD
      uses: vmactions/freebsd-vm@v1
      with:
        release: "15.1"
        mem: 12288
        copyback: false
        prepare: pkg install -y llvm23 cmake ninja gdb sdl2 mesa-libs mesa-dri libglvnd xorg-vfbserver xauth

    - name: Configure
      shell: freebsd {0}
      run: |
        # FreeBSD has no xvfb-run. Xvfb is up by the time the build finishes.
        daemon -f -p /var/run/xvfb99.pid Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp
        env CC=clang23 CXX=clang++23 cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      shell: freebsd {0}
      run: cmake --build build --config ${{env.BUILD_TYPE}} --target install

    - name: Test
      shell: freebsd {0}
      run: |
        cd build/install
        export MAGNUM_LOG=default DISPLAY=:99
        export LD_LIBRARY_PATH="$PWD/lib" ASAN_OPTIONS="detect_leaks=0:abort_on_error=1"
        export MESA_GL_VERSION_OVERRIDE=3.3FC MESA_GLSL_VERSION_OVERRIDE=330
        export MESA_EXTENSION_OVERRIDE=-GL_ARB_explicit_uniform_location
        set -e
        gdb -q -batch -x ../../.github/gdbscript.py --args bin/floormat-test
        gdb -q -batch -x ../../.github/gdbscript.py --args bin/floormat-benchmark
      timeout-minutes: 60

    - name: Test without a GL context
      shell: freebsd {0}
      run: |
        cd build/install
        export MAGNUM_LOG=default
        export LD_LIBRARY_PATH="$PWD/lib" ASAN_OPTIONS="detect_leaks=0:abort_on_error=1"
        gdb -q -batch -x ../../.github/gdbscript.py --args bin/floormat-test --no-gl
      timeout-minutes: 60
      if: ${{ !cancelled() }}

    - name: Test atomics and the work-stealing deque with TSan
      shell: freebsd {0}
      run: sh .github/thread-tests.sh clang++23 -O1 -fsanitize=thread
      timeout-minutes: 60
      if: ${{ !cancelled() }}

    - name: Test pgo-driver scenes
      shell: freebsd {0}
      run: |
        cd build/install
        export MAGNUM_LOG=default DISPLAY=:99
        export LD_LIBRARY_PATH="$PWD/lib" ASAN_OPTIONS="detect_leaks=0:abort_on_error=1"
        export MESA_GL_VERSION_OVERRIDE=3.3FC MESA_GLSL_VERSION_OVERRIDE=330
        export MESA_EXTENSION_OVERRIDE=-GL_ARB_explicit_uniform_location
        export LP_NUM_THREADS=$(sysctl -n hw.ncpu) FLOORMAT_PGO_DRIVER_SHORTEN_SCENES=1
        set -e
        gdb -q -batch -x ../../.github/gdbscript.py --args \
            bin/floormat-editor --scenes=all --driver-no-swapbuffers
      timeout-minutes: 60
